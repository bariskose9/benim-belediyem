name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (masaüstü + 375px)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # E2E gerçek veritabanına bağlanır: sağlık ucunun "db: ok" demesi ancak
    # gerçekten bağlanabiliyorsa doğrulanabilir. Sürüm local Docker ve Neon ile
    # aynı tutulur (docs/standards/13-environments.md).
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: belediye
          POSTGRES_PASSWORD: belediye
          POSTGRES_DB: benim_belediyem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U belediye -d benim_belediyem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ENV_LABEL: local
      DATABASE_URL: postgresql://belediye:belediye@localhost:5432/benim_belediyem
      DIRECT_URL: postgresql://belediye:belediye@localhost:5432/benim_belediyem
      # Tohumlama sahte üyelerin kimlik numarasını şifreleyip özetleyerek yazar.
      # Bunlar .env.example'daki LOCAL değerlerdir; canlı anahtarla ilgisi yoktur
      # (docs/standards/13-environments.md: canlı anahtar CI'da kullanılmaz).
      NATIONAL_ID_ENCRYPTION_KEY: bG9jYWwtZGV2LW9ubHkta2V5LTMyLWJ5dGVzLXh4eHg=
      NATIONAL_ID_HASH_SALT: local-dev-only-salt
      # Sahte KPS ucunun paylaşılan anahtarı (ADR-009). E2E, bu anahtar OLMADAN
      # atılan isteğin 401 aldığını kanıtlıyor — koruma canlı sunucuda test edilir.
      MOCK_KPS_API_KEY: local-dev-only-mock-kps-key-not-a-secret

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Tarayıcı ikilileri ~100MB; sürüme göre önbelleklenir.
      - name: Playwright sürümünü oku
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tarayıcı önbelleği
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Tarayıcıları kur
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      - name: Sistem bağımlılıkları (önbellekten gelindiyse)
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # Üretimde çalışan komutun aynısı: `migrate dev` ASLA kullanılmaz
      # (docs/standards/13-environments.md).
      - name: Migration'ları uygula
        run: npx prisma migrate deploy

      # Benzersiz index'lerin ve tohumlamanın idempotentliğinin gerçekten
      # çalıştığı ancak ayakta bir PostgreSQL ile kanıtlanabilir. ci.yml'deki
      # hızlı iş bilerek veritabanısız; bu yüzden bu kapı burada.
      - name: Veritabanı testleri (Vitest)
        run: npm run test:db

      # playwright.config.ts webServer'ı kendisi ayağa kaldırır (build + start).
      - name: E2E testleri
        run: npm run test:e2e

      # Performans bütçesi + WCAG 2.1 AA kapısı (adım 18c).
      # Eşikler ve neden o eşikler oldukları: tests/quality/budget.ts.
      #
      # AYRI ADIM, çünkü "davranış bozuldu" ile "bütçe aşıldı" bakılacak yeri
      # farklı iki sorun; tek adımda toplanınca hangisinin kırıldığı ancak
      # kütüğü açıp okuyarak anlaşılıyor.
      #
      # `!cancelled()`: E2E kırmızıysa da koşar. Bütçe sonucu o koşuda da
      # bilgi; iki turda öğrenilecek şeyi bir turda öğrenmek için.
      - name: Performans ve erişilebilirlik bütçesi
        if: ${{ !cancelled() }}
        run: npm run test:quality

      - name: Rapor (başarısızsa incelemek için)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
