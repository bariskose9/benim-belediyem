name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (masaüstü + 375px)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # E2E gerçek veritabanına bağlanır: sağlık ucunun "db: ok" demesi ancak
    # gerçekten bağlanabiliyorsa doğrulanabilir. Sürüm local Docker ve Neon ile
    # aynı tutulur (docs/standards/13-environments.md).
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: belediye
          POSTGRES_PASSWORD: belediye
          POSTGRES_DB: benim_belediyem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U belediye -d benim_belediyem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ENV_LABEL: local
      DATABASE_URL: postgresql://belediye:belediye@localhost:5432/benim_belediyem
      DIRECT_URL: postgresql://belediye:belediye@localhost:5432/benim_belediyem

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Tarayıcı ikilileri ~100MB; sürüme göre önbelleklenir.
      - name: Playwright sürümünü oku
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tarayıcı önbelleği
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Tarayıcıları kur
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      - name: Sistem bağımlılıkları (önbellekten gelindiyse)
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # Üretimde çalışan komutun aynısı: `migrate dev` ASLA kullanılmaz
      # (docs/standards/13-environments.md).
      - name: Migration'ları uygula
        run: npx prisma migrate deploy

      # playwright.config.ts webServer'ı kendisi ayağa kaldırır (build + start).
      - name: E2E testleri
        run: npm run test:e2e

      - name: Rapor (başarısızsa incelemek için)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
